name: Keep API Alive

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -I https://api.oncepost.site/health